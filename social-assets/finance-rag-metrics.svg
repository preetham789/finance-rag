<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 850 64px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 28px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #d8e0ea; stroke-width: 2; filter: url(#shadow); }
      .num { font: 850 70px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .label { font: 650 24px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .note { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .footer { font: 500 22px "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>
  <rect x="84" y="74" width="1432" height="752" rx="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text class="title" x="130" y="156">Finance RAG Project Snapshot</text>
  <text class="subtitle" x="134" y="200">A document AI system for Indian annual reports and RBI publications</text>

  <g transform="translate(130,276)">
    <rect class="card" x="0" y="0" width="390" height="180" rx="22"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#dbeafe"/>
    <path d="M52 44 H76 M52 60 H76 M52 76 H68" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <text class="num" x="120" y="86">50</text>
    <text class="label" x="120" y="126">financial documents</text>
    <text class="note" x="120" y="154">Annual reports + RBI publications</text>
  </g>

  <g transform="translate(606,276)">
    <rect class="card" x="0" y="0" width="390" height="180" rx="22"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#fef3c7"/>
    <path d="M60 42 V78 M46 58 H74" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
    <text class="num" x="120" y="86">9,155</text>
    <text class="label" x="120" y="126">pages processed</text>
    <text class="note" x="120" y="154">Cleaned and metadata-tagged</text>
  </g>

  <g transform="translate(1082,276)">
    <rect class="card" x="0" y="0" width="390" height="180" rx="22"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#ede9fe"/>
    <circle cx="48" cy="58" r="6" fill="#7c3aed"/>
    <circle cx="72" cy="46" r="6" fill="#7c3aed"/>
    <circle cx="76" cy="76" r="6" fill="#7c3aed"/>
    <path d="M53 56 L67 49 M52 62 L70 73" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
    <text class="num" x="120" y="86">33k+</text>
    <text class="label" x="120" y="126">retrieval chunks</text>
    <text class="note" x="120" y="154">Embedded into ChromaDB</text>
  </g>

  <g transform="translate(130,520)">
    <rect class="card" x="0" y="0" width="390" height="180" rx="22"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#dcfce7"/>
    <path d="M44 62 L56 74 L78 46" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="num" x="120" y="86">15/15</text>
    <text class="label" x="120" y="126">answered in eval</text>
    <text class="note" x="120" y="154">Fixed test set for quality checks</text>
  </g>

  <g transform="translate(606,520)">
    <rect class="card" x="0" y="0" width="390" height="180" rx="22"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#ffe4e6"/>
    <path d="M44 76 C52 48 68 48 78 38" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
    <circle cx="44" cy="76" r="5" fill="#e11d48"/>
    <circle cx="78" cy="38" r="5" fill="#e11d48"/>
    <text class="num" x="120" y="86">0.822</text>
    <text class="label" x="120" y="126">avg relevance</text>
    <text class="note" x="120" y="154">Retrieval quality metric</text>
  </g>

  <g transform="translate(1082,520)">
    <rect class="card" x="0" y="0" width="390" height="180" rx="22"/>
    <rect x="28" y="28" width="64" height="64" rx="18" fill="#ccfbf1"/>
    <path d="M46 46 H78 M46 62 H70 M46 78 H74" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
    <text class="num" x="120" y="86">0%</text>
    <text class="label" x="120" y="126">hallucination rate</text>
    <text class="note" x="120" y="154">On the project evaluation set</text>
  </g>

  <g transform="translate(130,744)">
    <rect x="0" y="0" width="1342" height="54" rx="16" fill="#0f172a"/>
    <text x="28" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#ffffff">Stack: PyMuPDF, BGE embeddings, ChromaDB, BM25, Groq/OpenAI-compatible LLM, FastAPI, Streamlit</text>
  </g>

  <text class="footer" x="130" y="858">GitHub: github.com/preetham789/finance-rag</text>
</svg>
